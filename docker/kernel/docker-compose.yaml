services:
  kernel:
    build:
      context: ../..
      dockerfile: docker/kernel/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: tiny-stories-experiment-kernel:local
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/notebooks
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --notebook-dir=/app/notebooks
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.disable_check_xsrf=True
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    environment:
      HOME: /home/app
      XDG_CACHE_HOME: /app/cache
      UV_CACHE_DIR: /app/cache/uv
      PROFILE_DIR: /app/profiles
      PYTHONPATH: /app/src
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    gpus: all
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: ${SHM_SIZE:-8gb}
    volumes:
      - ../../notebooks:/app/notebooks
      - ../../src:/app/src
      - ../../artifacts/profiles:/app/profiles
      - kernel_cache:/app/cache

volumes:
  kernel_cache:

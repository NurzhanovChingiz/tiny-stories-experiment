services:
  kernel:
    build:
      context: ../..
      dockerfile: docker/kernel/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: tiny-stories-experiment-kernel:local
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/notebooks/00_
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --notebook-dir=/app/notebooks/00_
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.disable_check_xsrf=True
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    environment:
      HOME: /home/app
      XDG_CACHE_HOME: /app/cache
      UV_CACHE_DIR: /app/cache/uv
      PYTHONPATH: /app/src
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: ${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-1}
      MIOPEN_FIND_MODE: ${MIOPEN_FIND_MODE:-2}
      HSA_ENABLE_DXG_DETECTION: "1"
    devices:
      - /dev/dxg
    group_add:
      - video
      - render
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: ${SHM_SIZE:-8gb}
    volumes:
      - ../../notebooks/00_:/app/notebooks/00_
      - ../../notebooks/data:/app/notebooks/data
      - ../../src:/app/src
      - kernel_cache:/app/cache
      - kernel_miopen:/home/app/.config/miopen
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /opt/rocm/lib/librocdxg.so:/usr/lib/librocdxg.so:ro
      - /opt/rocm/share/rocdxg/dids.conf:/usr/share/rocdxg/dids.conf:ro

volumes:
  kernel_cache:
  kernel_miopen:

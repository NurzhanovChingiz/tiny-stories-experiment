[project]
name = "tiny-stories-experiment"
version = "0.1.0"
description = "ROCm Jupyter kernel for notebooks/00_/gpu_pytorch.ipynb"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Notebook project: install the kernel group only. The ROCm image already
# provides HIP torch in /opt/venv; do not add a PyPI torch wheel.
[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint]
extend-ignore = ["E501","PLR0913", "PLR2004", "PLR0912", "PLW2901", "COM812"]
select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "I",    # isort
  "E",    # flake8-errors
  "W",    # flake8-warnings
  "Q",    # flake8-quotes
  "F",    # flake8-pyflakes
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "S",    # flake8-bandit
  "RSE",  # flake8-raise
  "BLE",  # flake8-blind-except
  "T10",  # flake8-debugger
  "SIM",  # flake8-simplify
  "EM",   # flake8-errmsg
  "T20",  # flake8-print
  "FBT",  # flake8-boolean-trap
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "FIX",  # flake8-fixme
  "INT",  # flake8-gettext
  "FA",   # flake8-future-annotations
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "N",    # pep8-naming
  "PGH",  # pygrep-hooks
  "TRY",  # tryceratops
  "FLY",  # flynt
  "C90",  # mccabe
  "PD",   # pandas-vet
  "PL",   # Pylint
  "RUF",  # Ruff
  "ERA",  # eradicate
  "PERF", # Perflint
  "FURB", # refurb
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]


[tool.ruff.lint.flake8-bandit]
check-typed-exception = true # check typed exception handlers

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.19",
    "xenon>=0.9.3",
]

notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.4",
]

name: tiny_stories
seed: 137
data_dir: data/tokenized/tiny_stories
vocab_file: vocab.json
sequence_length: 64
batch_size: 8
epochs: 3
learning_rate: 0.003
weight_decay: 0.01
scheduler_type: cosine_warmup
warmup_epochs: 1
eta_min: 1.0e-6
step_size: 10
gamma: 0.1
max_lr: 0.003
min_delta: 0.001
patience: 5
num_workers: 31
pin_memory: false
persistent_workers: false
amp: false
precision: 32-true
enable_progress_bar: true
model:
  embedding_dim: 64
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
split:
  test_size: 0.2
  val_size: 0.15
checkpoint_dir: artifacts/train/checkpoints
log_dir: artifacts/train/lightning_logs
